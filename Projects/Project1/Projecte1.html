<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horror Experience Project</title>
  <link rel="stylesheet" href="projecte1.css" />
  <script>
    function goBack() {
      // Surt de Projects/Project2/ per anar a l'index.html de l'arrel
      window.location.href = "../../index.html";
    }

    // Esperem a que tot l'HTML estigui carregat per buscar els elements
    document.addEventListener('DOMContentLoaded', () => {
      const phoneIcon = document.getElementById('phone-icon');
      const phonePopup = document.getElementById('phone-popup');

      if (phoneIcon && phonePopup) {
        phoneIcon.addEventListener('click', (e) => {
          e.stopPropagation(); // Evita que el clic es propagui al document
          const isVisible = phonePopup.style.display === 'block';
          phonePopup.style.display = isVisible ? 'none' : 'block';
        });

        document.addEventListener('click', (e) => {
          if (!phoneIcon.contains(e.target) && !phonePopup.contains(e.target)) {
            phonePopup.style.display = 'none';
          }
        });
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <header class="header">
      <h1 class="name">David Casany</h1>
      <div class="contact-icons">
        <a href="mailto:casany.balleste@gmail.com" data-tooltip="Mail">📧</a>
        
        <div style="position: relative; display: inline-block;">
          <a id="phone-icon" data-tooltip="Phone number" style="cursor: pointer;">📞</a>
          <div id="phone-popup" class="phone-popup" style="display: none;">+34 686961229</div>
        </div>

        <!-- Ruta del CV corregida (sense accent) -->
        <a href="../../files/CV_David_Casany_Ballesté.pdf" target="_blank" class="skill-item" style="display: inline-flex; align-items: center; gap: 5px; font-size: 1em;" data-tooltip="Resume">
          Resume <span style="transform: rotate(90deg); display: inline-block;">➤</span>
        </a>
      </div>
    </header>

    <div class="back-button" onclick="goBack()" style="cursor: pointer;">
      <span class="arrow">⬅</span> Go back
    </div>

    <div class="main-video">
      <video src="../../vid/VideoProject1.mp4" autoplay muted loop></video>
    </div>

    <div class="info-section">
      <div class="info-box">
        <h2>About</h2>
        <p>This my project Terminal velocitym, a platformer where time is life. It was implemented with unity 2D.</p>
      </div>

      <div class="info-box">
        <h2>Project Info</h2>
        <ul>
          <li>Role: Programmer, Game and Level Designer</li>
          <li>Team size: 1</li>
          <li>Time frame: 4 weeks</li>
          <li>Engine: Unity 2D</li>
        </ul>
      </div>
    </div>

    
  </div>
</body>

</html>
